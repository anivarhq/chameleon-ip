name: android

on:
  push:
    branches: [main]
    paths: ["android/**", "core/**", "scripts/build-core.sh", ".github/workflows/android.yml", ".github/scripts/android-smoke.sh"]
  pull_request:
    paths: ["android/**", "core/**", "scripts/build-core.sh", ".github/workflows/android.yml", ".github/scripts/android-smoke.sh"]
  # release.yml calls this to build what it publishes.
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_B64: { required: false }
      ANDROID_KEYSTORE_PASSWORD: { required: false }
      ANDROID_KEY_ALIAS: { required: false }

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: ndk
        with:
          ndk-version: r28c

      - name: build the shared core
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: ./scripts/build-core.sh

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.2.0"

      # The release key exists only as repo secrets, so a fork's pull request
      # builds an unsigned release APK and skips the checks that need a signed one.
      - name: release key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "CHAMELEON_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: assemble
        working-directory: android
        env:
          CHAMELEON_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CHAMELEON_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle --no-daemon assembleDebug assembleRelease

      # What a phone will check before installing, checked here first: the
      # signature and its certificate, 16 KB page alignment (Android 15+ devices
      # refuse native code that isn't), and the identity in the manifest.
      - name: verify the release APK
        if: steps.key.outputs.signed == 'true'
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$bt/apksigner" verify --verbose --print-certs "$apk" | tee signing.txt
          # The release key's certificate, pinned: a build signed with any other
          # key could never update an installed copy.
          grep -q "certificate SHA-256 digest: 9134451650f0f7c8af504b176e0e6b8a906f84cc2f81449c07b529a4233c746f" signing.txt
          "$bt/zipalign" -c -P 16 -v 4 "$apk" > /dev/null
          "$bt/aapt2" dump badging "$apk" | tee badging.txt | head -3
          grep -q "package: name='com.anivarhq.chameleon'" badging.txt
          grep -q "^minSdkVersion:'24'" badging.txt
          mkdir -p out && cp "$apk" out/ChameleonIP-android.apk

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chameleon-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.key.outputs.signed == 'true'
        with:
          name: chameleon-android
          path: out/ChameleonIP-android.apk
          if-no-files-found: error

  # The APK that ships, on an emulator: installs, launches, starts the camera
  # and opens its RTSP port without crashing. Not a phone, and the notes say so,
  # but it is the same file a phone would get.
  emulator:
    needs: apk
    if: needs.apk.outputs.signed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chameleon-android
          path: apk

      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: bash .github/scripts/android-smoke.sh apk/ChameleonIP-android.apk

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: emulator-screen
          path: emulator-screen.png
          if-no-files-found: ignore
