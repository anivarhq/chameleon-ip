# The Xcode project is generated from this file (xcodegen), so there is no
# .xcodeproj in the repository to merge-conflict or drift.
name: ChameleonIP

options:
  bundleIdPrefix: com.anivarhq
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
  createIntermediateGroups: true

targets:
  ChameleonIP:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources
    dependencies:
      # Built by scripts/build-core.sh, the same core the phones and the
      # desktop use.
      - framework: Frameworks/Mobile.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anivarhq.chameleon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        # Sending anything on the local network prompts for permission; an
        # incoming connection does not, so the servers work unprompted.
        INFOPLIST_KEY_NSCameraUsageDescription: "Chameleon streams this camera to your NVR."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Chameleon can stream this device's microphone with the video."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Chameleon answers NVRs that look for cameras on your network."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # Portrait and landscape: a camera on a shelf ends up either way.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
